apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-b
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-b
  namespace: default
  labels:
    app: workload-b
spec:
  selector:
    matchLabels:
      app: workload-b
  template:
    metadata:
      labels:
        app: workload-b
    spec:
      serviceAccountName: workload-b
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: workload-b
          image: ghcr.io/spiffe/spire-agent:1.11.2
          command: ["/opt/spire/bin/spire-agent"]
          args: ["api", "watch", "-socketPath", "/run/spire/sockets/agent.sock"]
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: Directory
